<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="50%" stop-color="#1E293B"></stop>
      <stop offset="100%" stop-color="#1E3A8A"></stop>
    </linearGradient>
    <pattern id="grid-app" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"></path>
    </pattern>
    <filter id="shadow-app" x="-10%" y="-10%" width="120%" height="120%">
      <fedropshadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"></fedropshadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-app)"></rect>
  <rect width="100%" height="100%" fill="url(#grid-app)"></rect>

  <!-- LEFT COLUMN: Editorial / Branding -->
  <rect x="70" y="70" width="170" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"></rect>
  <text x="155" y="91" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1px" text-anchor="middle">COMPARACIÓN DE MÉTODOS</text>

  <text x="70" y="160" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1px">¿Aplicación o navegador?</text>
  <text x="70" y="215" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600">Regla en tu teléfono sin instalación</text>
  
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Análisis de comodidad, privacidad y memoria del dispositivo</text>

  <!-- Comparison Summary Pills -->
  <g transform="translate(70, 315)">
    <rect width="360" height="52" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"></rect>
    <circle cx="28" cy="26" r="10" fill="#10B981"></circle>
    <path d="M 23 26 L 27 30 L 33 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
    <text x="48" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Regla online: 0 MB, sin permisos</text>
  </g>
  <g transform="translate(70, 385)">
    <rect width="360" height="52" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)"></rect>
    <circle cx="28" cy="26" r="10" fill="#EF4444"></circle>
    <line x1="23" y1="21" x2="33" y2="31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></line>
    <line x1="33" y1="21" x2="23" y2="31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></line>
    <text x="48" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Tienda de aplicaciones: 45 MB, anuncios</text>
  </g>

  <!-- Site Brand -->
  <text x="70" y="570" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Regla.Onl - Regla en línea 1:1</text>

  <!-- RIGHT COLUMN: Dual Device / Flow Graphic -->
  <g transform="translate(480, 50)" filter="url(#shadow-app)">
    <rect width="660" height="530" rx="16" fill="#0F172A" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5"></rect>

    <!-- Card 1: Browser Ruler (Recommended / Green Theme) -->
    <g transform="translate(30, 40)">
      <rect width="285" height="450" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2"></rect>
      
      <!-- Card Badge -->
      <rect x="20" y="20" width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)"></rect>
      <text x="85" y="37" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NAVEGADOR</text>

      <!-- Simulated Browser Bar -->
      <g transform="translate(20, 60)">
        <rect width="245" height="32" rx="6" fill="#0F172A" stroke="#334155"></rect>
        <circle cx="16" cy="16" r="4" fill="#10B981"></circle>
        <text x="30" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">https://www.regla.onl</text>
      </g>

      <!-- Active Ruler Interface Preview -->
      <g transform="translate(20, 105)">
        <rect width="245" height="150" rx="8" fill="#0F172A" stroke="#334155"></rect>
        <!-- Ruler edge on left -->
        <line x1="15" y1="15" x2="15" y2="135" stroke="#38BDF8" stroke-width="2"></line>
        <!-- Ruler ticks -->
        <line x1="15" y1="20" x2="40" y2="20" stroke="#FFFFFF" stroke-width="2"></line>
        <text x="48" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">0</text>
        <line x1="15" y1="45" x2="28" y2="45" stroke="#94A3B8" stroke-width="1.5"></line>
        <line x1="15" y1="70" x2="35" y2="70" stroke="#FFFFFF" stroke-width="1.5"></line>
        <text x="43" y="74" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="9">1</text>
        <line x1="15" y1="95" x2="28" y2="95" stroke="#94A3B8" stroke-width="1.5"></line>
        <line x1="15" y1="120" x2="40" y2="120" stroke="#FFFFFF" stroke-width="2"></line>
        <text x="48" y="124" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">2cm</text>
        
        <!-- Live status -->
        <rect x="85" y="45" width="145" height="60" rx="6" fill="#1E293B"></rect>
        <text x="95" y="68" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Listo para medir</text>
        <text x="95" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Escala 1:1 activa inmediatamente</text>
      </g>

      <!-- Feature checklist -->
      <g transform="translate(25, 275)">
        <text x="0" y="20" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓ 0 MB de memoria utilizada</text>
        <text x="0" y="50" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓ Sin instalación</text>
        <text x="0" y="80" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓ Privacidad total (0 permisos)</text>
        <text x="0" y="110" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓ Siempre la última versión</text>
      </g>
    </g>

    <!-- Card 2: App Store Download (Negative Comparison / Red/Gray Theme) -->
    <g transform="translate(345, 40)">
      <rect width="285" height="450" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1.5"></rect>
      
      <!-- Card Badge -->
      <rect x="20" y="20" width="130" height="26" rx="13" fill="rgba(148, 163, 184, 0.15)"></rect>
      <text x="85" y="37" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TIENDA DE APLICACIONES</text>

      <!-- App Store Card Preview -->
      <g transform="translate(20, 60)">
        <rect width="245" height="85" rx="8" fill="#0F172A" stroke="#334155"></rect>
        <rect x="15" y="15" width="55" height="55" rx="12" fill="#334155"></rect>
        <path d="M 30 30 L 55 55 M 30 55 L 55 30" stroke="#64748B" stroke-width="3"></path>
        <text x="82" y="35" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Regla AR Pro</text>
        <text x="82" y="55" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11">Tamaño: 48,5 MB</text>
        <!-- Download button -->
        <rect x="175" y="45" width="60" height="24" rx="12" fill="#2563EB"></rect>
        <text x="205" y="61" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Descargar</text>
      </g>

      <!-- App Permission Alert Box -->
      <g transform="translate(20, 160)">
        <rect width="245" height="95" rx="8" fill="#0F172A" stroke="#DC2626" stroke-width="1"></rect>
        <text x="15" y="25" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Permisos requeridos:</text>
        <text x="15" y="46" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Acceso a cámara (cámara)</text>
        <text x="15" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Ubicación del dispositivo</text>
        <text x="15" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Seguimiento de publicidad (IDFA)</text>
      </g>

      <!-- Disadvantages list -->
      <g transform="translate(25, 275)">
        <text x="0" y="20" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✕ Descarga la memoria del teléfono</text>
        <text x="0" y="50" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✕ Requiere inicio de sesión o cuenta</text>
        <text x="0" y="80" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✕ Intersticiales agresivos</text>
        <text x="0" y="110" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✕ Suscripciones semanales pagas</text>
      </g>
    </g>
  </g>
</svg>